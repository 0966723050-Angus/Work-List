<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATK近期工作項目</title>
<meta name="description" content="ATK近期工作項目 - 表格與甘特圖檢視,可線上編輯並同步回 Google Drive">
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>ATK近期工作項目</h1>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" data-page="table">工作項目</button>
    <button class="tab-btn" data-page="chart">甘特圖</button>
  </nav>

  <button id="editFab" class="btn btn-primary fab-edit">✎ 編輯</button>

  <main>
    <!-- 表格頁 -->
    <section id="page-table" class="page active">
      <div class="toolbar">
        <span id="statusLine" class="status-line">載入中…</span>
        <button id="cancelEditBtn" class="btn btn-ghost btn-sm" style="display:none;">取消編輯</button>
      </div>
      <div id="recordList" class="record-list"></div>
      <div id="emptyState" class="empty-state" hidden>目前沒有工作項目</div>
    </section>

    <!-- 圖表頁 -->
    <section id="page-chart" class="page">
      <div class="chart-legend">
        <span><i class="legend-dot" style="background:var(--color-status-confirmed)"></i>已確定</span>
        <span><i class="legend-dot" style="background:var(--color-status-tentative)"></i>暫定</span>
        <span><i class="legend-dot" style="background:var(--color-status-pending)"></i>待安排/其他</span>
      </div>
      <div class="gantt-range-bar">
        <label>開始日期
          <input type="date" id="ganttStart">
        </label>
        <label>結束日期
          <input type="date" id="ganttEnd">
        </label>
        <button id="ganttThisWeekBtn" class="btn btn-ghost btn-sm" type="button">本週</button>
        <button id="ganttTwoMonthBtn" class="btn btn-ghost btn-sm" type="button">雙月</button>
        <button id="ganttRefreshBtn" class="btn btn-ghost btn-sm" type="button">🔄 更新資料</button>
      </div>
      <div class="gantt-wrap">
        <div id="ganttLabels" class="gantt-labels"></div>
        <div class="gantt-scroll">
          <svg id="ganttSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
    </section>
  </main>

  <button id="addRowBtn" class="btn btn-ghost fab-add" style="display:none;">＋ 新增項目</button>
  <button id="saveFab" class="btn btn-primary fab-save" style="display:none;">💾 儲存</button>

  <!-- 密碼輸入 modal -->
  <div id="passwordModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2>輸入編輯密碼</h2>
      <p>請輸入密碼以解鎖表格編輯功能</p>
      <input id="passwordInput" type="password" inputmode="text" autocomplete="off" placeholder="密碼">
      <div id="passwordError" class="modal-error"></div>
      <div class="modal-actions">
        <button id="passwordCancelBtn" class="btn btn-ghost btn-sm">取消</button>
        <button id="passwordConfirmBtn" class="btn btn-primary btn-sm">確認</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="ganttTooltip" class="gantt-tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/xlsx-io.js"></script>
  <script src="js/drive-auth.js"></script>
  <script src="js/gantt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
